[project]
name = "mpc-from-stamped"
version = "0.1.0"
description = "Standalone extract of Stamped offset-free MPC and CasADi IBH twin for coursework"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "casadi==3.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpc_from_stamped"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
