[project]
name = "model-predictive-control"
version = "0.1.0"
description = "Offset-free MPC and CasADi heater twin for industrial control coursework"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "casadi==3.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "streamlit>=1.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpc_core"]

# Map src/mpc_core -> import name mpc_core when installed via `pip install -e .`.
[tool.hatch.build.targets.wheel.sources]
"src/mpc_core" = "mpc_core"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
