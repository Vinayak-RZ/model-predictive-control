<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground · MPC Heater Lab</title>
    <link rel="stylesheet" href="css/lab.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <div class="shell" id="shell"></div>
    <script type="module">
      import { mountNav } from "./js/nav.js";
      import { polishTriple } from "./js/presentation.js";
      import { tripleControlFigure } from "./js/charts.js";
      import { COLORS } from "./js/theme.js";

      const PRESETS = [
        { key: "setpoint_jump", label: "Setpoint jump" },
        { key: "cold_door", label: "Cold-door" },
        { key: "heat_loss_noise", label: "Heat-loss + noise" },
        { key: "tight_power", label: "Tight power" },
        { key: "soft_limits", label: "Soft limits" },
        { key: "model_mismatch", label: "Model mismatch" },
      ];

      document.getElementById("shell").innerHTML = `
        ${mountNav("playground")}
        <main class="main">
          <h1>Playground</h1>
          <p class="lede">
            This page opens on a tight power and rate limit. That is the case where MPC keeps
            the slew feasible, and the optimised PID (tuned once on a mild jump, then left alone)
            does not.
          </p>
          <div class="legend">
            <span><i class="swatch" style="background:${COLORS.mpc}"></i>MPC</span>
            <span><i class="swatch" style="background:${COLORS.pid}"></i>PID</span>
            <span><i class="swatch" style="background:${COLORS.opt}"></i>Opt. PID</span>
          </div>
          <div class="presets" id="presets"></div>
          <p class="caption" id="active"></p>
          <div class="chart" id="tempChart"></div>
          <div class="chart" id="powerChart"></div>
          <div class="insights" id="insights"></div>
          <div class="callout" id="callout" hidden></div>
          <p class="caption">
            Dashed lines are the power limits. Optimised PID uses the same gains on every preset:
            the ones found on the mild setpoint jump. MPC uses the same planner throughout.
          </p>
        </main>
      `;

      const presetsEl = document.getElementById("presets");
      PRESETS.forEach((p) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = p.label;
        b.dataset.key = p.key;
        b.addEventListener("click", () => loadPreset(p.key));
        presetsEl.appendChild(b);
      });

      function fmtSettle(s) {
        return s == null ? "Did not settle" : `Settled in ${Math.round(s)} s`;
      }

      function renderInsights(triple) {
        const items = [
          ["MPC", triple.mpc],
          ["PID", triple.pid],
          ["Opt. PID", triple.optimized_pid],
        ];
        const insights = document.getElementById("insights");
        insights.innerHTML = items
          .map(([label, run]) => {
            const hits = run.metrics.constraint_violation_steps || 0;
            const tone = hits > 0 ? "bad" : "ok";
            const word = hits > 0 ? "violated" : "feasible";
            return `<div class="insight ${tone}">
              <div class="label">${label}</div>
              <div class="value">${fmtSettle(run.metrics.settling_time_s)}</div>
              <div class="hint">${hits} limit hits · ${word}</div>
            </div>`;
          })
          .join("");

        const mpcHits = triple.mpc.metrics.constraint_violation_steps || 0;
        const optHits = triple.optimized_pid.metrics.constraint_violation_steps || 0;
        const callout = document.getElementById("callout");
        if (mpcHits < optHits) {
          callout.hidden = false;
          callout.textContent = `MPC: ${mpcHits} limit hits. Opt. PID: ${optHits}. Those Opt. PID gains were locked on the mild setpoint jump and not retuned on this run.`;
        } else if (mpcHits === 0 && (triple.pid.metrics.constraint_violation_steps || 0) > 0) {
          callout.hidden = false;
          callout.textContent = `MPC: ${mpcHits} limit hits. Hand-tuned PID: ${triple.pid.metrics.constraint_violation_steps}.`;
        } else {
          callout.hidden = true;
        }
      }

      async function loadPreset(key) {
        [...presetsEl.querySelectorAll("button")].forEach((b) => {
          b.classList.toggle("active", b.dataset.key === key);
        });
        const res = await fetch(`data/playground/${key}.json`);
        if (!res.ok) throw new Error(`Missing data/playground/${key}.json`);
        const raw = await res.json();
        const triple = polishTriple(raw);
        const p = triple.params || {};
        document.getElementById("active").textContent =
          `Active: ${p.ref_low_c}→${p.ref_high_c} °C at ${p.ref_step_at_s} s · noise σ=${Number(p.noise_std_c).toFixed(2)} · ` +
          `u_max=${p.u_max} kW · Δu=${p.du_max} · disturbance=${p.disturbance_event || "none"}` +
          (p.model_mismatch ? " · mismatch on" : "");
        tripleControlFigure(
          triple,
          document.getElementById("tempChart"),
          document.getElementById("powerChart")
        );
        renderInsights(triple);
      }

      loadPreset("tight_power").catch((err) => {
        document.getElementById("active").textContent = String(err);
      });
    </script>
  </body>
</html>
