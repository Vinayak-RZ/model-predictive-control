<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Step-through · MPC Heater Lab</title>
    <link rel="stylesheet" href="css/lab.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <div class="shell" id="shell"></div>
    <script type="module">
      import { mountNav } from "./js/nav.js";
      import { horizonFigure } from "./js/charts.js";

      const SCENARIOS = [
        { key: "setpoint_tracking", label: "Setpoint tracking" },
        { key: "disturbance_rejection", label: "Disturbance rejection" },
        { key: "power_constraints", label: "Power constraints" },
      ];

      document.getElementById("shell").innerHTML = `
        ${mountNav("step")}
        <main class="main">
          <h1>Step-through</h1>
          <p class="lede">See how MPC plans each move on the heater.</p>
          <div class="row">
            <label for="scenario">Scenario</label>
            <select id="scenario"></select>
          </div>
          <div class="row">
            <label for="step">Step</label>
            <input id="step" type="range" min="0" max="0" value="0" style="flex:1" />
            <span id="stepLabel" class="caption" style="margin:0"></span>
          </div>
          <div class="callout" id="caption" style="margin-top:8px;margin-bottom:16px"></div>
          <p class="caption" id="meta" style="margin-bottom:12px"></p>
          <div class="chart" id="chart"></div>
        </main>
      `;

      const select = document.getElementById("scenario");
      SCENARIOS.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s.key;
        opt.textContent = s.label;
        select.appendChild(opt);
      });

      let snaps = [];
      const slider = document.getElementById("step");

      function show(i) {
        const snap = snaps[i];
        if (!snap) return;
        document.getElementById("stepLabel").textContent = `${i + 1} / ${snaps.length}`;
        document.getElementById("caption").textContent =
          snap.caption ||
          `At t=${snap.time_s.toFixed(0)}s the measured temperature is ${snap.y_meas.toFixed(1)}°C.`;
        document.getElementById("meta").textContent =
          `y=${snap.y_meas.toFixed(2)} °C · u=${snap.u_applied.toFixed(1)} kW · d̂=${snap.d_hat.toFixed(3)} · solve ${snap.solve_ms.toFixed(2)} ms`;
        horizonFigure(snap, document.getElementById("chart"));
      }

      async function loadScenario(key) {
        const res = await fetch(`data/step_through/${key}_h25.json`);
        if (!res.ok) throw new Error(`Missing step-through log for ${key}`);
        const data = await res.json();
        snaps = data.snapshots || [];
        slider.max = String(Math.max(snaps.length - 1, 0));
        slider.value = "0";
        show(0);
      }

      slider.addEventListener("input", () => show(Number(slider.value)));
      select.addEventListener("change", () => loadScenario(select.value));
      loadScenario(SCENARIOS[0].key).catch((err) => {
        document.getElementById("meta").textContent = String(err);
      });
    </script>
  </body>
</html>
