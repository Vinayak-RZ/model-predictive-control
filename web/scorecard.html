<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scorecard · MPC Heater Lab</title>
    <link rel="stylesheet" href="css/lab.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  </head>
  <body>
    <div class="shell" id="shell"></div>
    <script type="module">
      import { mountNav } from "./js/nav.js";
      import { SCORECARD_ROWS } from "./js/presentation.js";
      import { groupedMetricsFigure } from "./js/charts.js";

      document.getElementById("shell").innerHTML = `
        ${mountNav("scorecard")}
        <main class="main">
          <h1>Scorecard</h1>
          <p class="lede">
            Same plant, same limits. Optimised PID keeps the gains from the mild setpoint jump.
            MPC keeps the same planner. Compare limit hits and settling time.
          </p>
          <p class="caption" id="powerLine"></p>
          <div class="row">
            <label for="scenario">Scenario</label>
            <select id="scenario"></select>
          </div>
          <h2 id="scenarioTitle" style="font-size:18px;font-weight:600;margin:8px 0 12px"></h2>
          <div class="chart" id="chart"></div>
          <h2 style="font-size:18px;font-weight:600;margin:20px 0 12px">Metrics table</h2>
          <table class="metrics" id="table"></table>
        </main>
      `;

      const scenarios = [...new Set(SCORECARD_ROWS.map((r) => r.Scenario))];
      const select = document.getElementById("scenario");
      scenarios.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        select.appendChild(opt);
      });

      const power = SCORECARD_ROWS.filter((r) => r.Scenario.includes("Power"));
      const viol = Object.fromEntries(power.map((r) => [r.Controller, r.Violations]));
      document.getElementById("powerLine").textContent =
        `Power-limit hits: PID ${viol.PID ?? 0}, MPC ${viol.MPC ?? 0}, optimised PID ${viol["Optimized PID"] ?? 0}. ` +
        "MPC plans inside the window and the rate limit. The frozen Opt. PID can still clip them.";

      function renderTable() {
        const head = ["Scenario", "Controller", "Overshoot %", "Settling [s]", "Energy [kWh]", "Limit hits"];
        const body = SCORECARD_ROWS.map(
          (r) => `<tr>
            <td>${r.Scenario}</td>
            <td>${r.Controller}</td>
            <td>${Number(r["Overshoot %"]).toFixed(1)}</td>
            <td>${r["Settling [s]"] == null ? "—" : Math.round(r["Settling [s]"])}</td>
            <td>${Number(r["Energy [kWh]"]).toFixed(2)}</td>
            <td>${r.Violations}</td>
          </tr>`
        ).join("");
        document.getElementById("table").innerHTML =
          `<thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody>`;
      }

      function renderScenario(scenario) {
        document.getElementById("scenarioTitle").textContent = scenario;
        groupedMetricsFigure(SCORECARD_ROWS, scenario, document.getElementById("chart"));
      }

      select.addEventListener("change", () => renderScenario(select.value));
      renderTable();
      renderScenario(scenarios[0]);
    </script>
  </body>
</html>
